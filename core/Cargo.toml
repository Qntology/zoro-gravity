[package]
name = "zorogravity-core"
version = "0.1.0"
edition = "2021"
description = "GovGraph-ZOROGRAVITY 민원 심사 코어: 5-Gate 상태 머신, 자동화 정책, 감사 로그, 비식별 해시, candle 기반 Zoro-1 헤드"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
candle-core = "0.11.0"
candle-nn = "0.11.0"
# AMD ROCm/HIP 백엔드. `rocm` 기능을 켰을 때만 빌드합니다.
candle-rocm = { path = "../../candle-rocm-vulkan/candle-backend", optional = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
half = "2"
hex = "0.4"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
memmap2 = "0.9"
rayon = "1"
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokenizers = { version = "0.23.2", default-features = false, features = ["onig"] }
zeroize = "1"

[features]
# AMD GPU 기본 경로. Vulkan 은 SDK 없이 드라이버의 vulkan-1.dll 만 있으면 됩니다.
default = ["vulkan"]
vulkan = ["candle-core/vulkan", "candle-nn/vulkan"]
# ROCm/HIP. HIP SDK(hipcc, amdhip64, rocblas)가 설치돼 있어야 합니다. docs/gpu-backends.md 참고.
rocm = ["dep:candle-rocm", "candle-core/rocm", "candle-nn/rocm"]
# NVIDIA CUDA. 커널을 빌드 때 nvcc 로 컴파일하므로 CUDA Toolkit 이 있어야 합니다. docs/gpu-backends.md 참고.
cuda = ["candle-core/cuda", "candle-nn/cuda"]

[package]
name = "zorogravity-models"
version = "0.1.0"
edition = "2021"
description = "zoro-gravity 모델 폴더(AppData) · 다운로드 · 삭제"
license = "Apache-2.0"

[lib]
name = "zorogravity_models"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
dirs = "6"
ureq = { version = "3", default-features = false, features = ["rustls"], optional = true }

[features]
# 코어 엔진은 폴더 위치만 쓰고(default-features = false), 다운로드는 앱이 합니다.
default = ["download"]
download = ["dep:ureq"]

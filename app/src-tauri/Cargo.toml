[package]
name = "zorogravity-app"
version = "0.1.0"
edition = "2021"
description = "zoro-gravity 민원 창구 앱: 민원인 키오스크와 공무원 콘솔"
license = "Apache-2.0"

[lib]
name = "zorogravity_app_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["vulkan"]
vulkan = ["zorogravity-core/vulkan"]
rocm = ["zorogravity-core/rocm"]
cuda = ["zorogravity-core/cuda"]
metal = ["zorogravity-core/metal"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
candle-core = "0.11.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
# 접수 · 심사 로직은 코어가 맡습니다. GPU 백엔드는 앱의 기능으로 고릅니다.
zorogravity-core = { path = "../../core", default-features = false }
zorogravity-models = { path = "../../tools/model-settings" }

[package]
name = "zorogravity-app"
version = "0.1.0"
edition = "2021"
description = "zoro-gravity 민원 창구 앱: 민원인 키오스크와 공무원 콘솔"
license = "Apache-2.0"

[lib]
name = "zorogravity_app_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
zorogravity-models = { path = "../../tools/model-settings" }
